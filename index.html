<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>YOLOv8 tinygrad WebGPU</title>
    <script type="module">
        import yolov8 from "./net.js"
        window.yolov8 = yolov8;
    </script>
    <style>
        body {
            text-align: center;
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            overflow: hidden;
            touch-action: none;
        }

        .video-container {
            position: relative;
            width: 100%;
            height: 100vh;
            margin: 0 auto;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: #000;
        }

        #video, #canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .loader {
            width: 48px;
            height: 48px;
            border: 5px solid #FFF;
            border-bottom-color: transparent;
            border-radius: 50%;
            display: inline-block;
            box-sizing: border-box;
            animation: rotation 1s linear infinite;
        }

        @keyframes rotation {
            0% {
                transform: rotate(0deg);
            }
            100% {
                transform: rotate(360deg);
            }
        }

        #canvas {
            background: transparent;
        }

        #fps-meter {
            position: absolute;
            top: 20px;
            right: 20px;
            background-color: rgba(0, 0, 0, 0.7);
            color: white;
            padding: 10px;
            font-size: 18px;
            border-radius: 5px;
            z-index: 10;
        }

        #camera-status {
            position: absolute;
            top: 20px;
            left: 20px;
            background-color: rgba(0, 0, 0, 0.7);
            color: white;
            padding: 10px;
            font-size: 18px;
            border-radius: 5px;
            z-index: 10;
            display: none;
        }

        #switch-btn {
            position: fixed;
            bottom: 20px;
            right: 20px;
            width: 50px;
            height: 50px;
            background-color: rgba(255,255,255,0.3);
            color: white;
            border: none;
            border-radius: 50%;
            font-size: 20px;
            z-index: 100;
            display: none;
        }

        #error-message {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: white;
            font-family: Arial, sans-serif;
            background-color: rgba(0,0,0,0.8);
            padding: 20px;
            text-align: center;
            display: none;
            z-index: 200;
        }

        #retry-btn {
            margin-top: 20px;
            padding: 10px 20px;
            background-color: #4285f4;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 16px;
        }

        h1 {
            margin-top: 20px;
        }

        .loading-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.6);
            z-index: 10;
        }

        .loading-text {
            font-size: 24px;
            color: white;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>
    <h2>YOLOv8 tinygrad WebGPU</h2>
    <h2 id="wgpu-error" style="display: none; color: red;">Error: WebGPU is not supported in this browser</h2>
    <div class="video-container">
        <video id="video" muted autoplay playsinline></video>
        <canvas id="canvas"></canvas>
        <div id="fps-meter"></div>
        <div id="camera-status"></div>
        <div id="error-message">
            <div id="error-text"></div>
            <button id="retry-btn">Try Again</button>
        </div>
        <button id="switch-btn" title="Switch camera">↻</button>

        <div id="div-loading" class="loading-container">
            <p class="loading-text">Loading model</p>
            <span class="loader"></span>
        </div>
    </div>
    <script>
        let net = null;
        const modelInputSize = 640;
        let lastCalledTime;
        let fps = 0, accumFps = 0, frameCounter = 0;
        let currentStream = null;
        let currentCamera = 'front'; // Start with front camera

        const video = document.getElementById('video');
        const canvas = document.getElementById('canvas');
        const context = canvas.getContext('2d');
        const offscreenCanvas = document.createElement('canvas');
        const fpsMeter = document.getElementById('fps-meter');
        const cameraStatus = document.getElementById('camera-status');
        const loadingContainer = document.getElementById('div-loading');
        const wgpuError = document.getElementById('wgpu-error');
        const errorMessage = document.getElementById('error-message');
        const errorText = document.getElementById('error-text');
        const retryBtn = document.getElementById('retry-btn');
        const switchBtn = document.getElementById('switch-btn');
        offscreenCanvas.width = modelInputSize;
        offscreenCanvas.height = modelInputSize;
        const offscreenContext = offscreenCanvas.getContext('2d');

        // Function to stop the current stream
        function stopCurrentStream() {
            if (currentStream) {
                currentStream.getTracks().forEach(track => track.stop());
                currentStream = null;
            }
        }

        // Function to start camera
        async function startCamera(cameraType) {
            try {
                stopCurrentStream();
                
                cameraStatus.textContent = cameraType === 'rear' 
                    ? 'Starting rear camera...' 
                    : 'Starting front camera...';
                cameraStatus.style.display = 'block';
                errorMessage.style.display = 'none';

                // Try to get the requested camera type
                let stream = await tryGetCamera(cameraType);
                
                if (!stream && cameraType === 'front') {
                    // If front camera fails, try any camera as fallback
                    stream = await tryGetUserMedia({ video: true });
                }

                if (stream) {
                    currentStream = stream;
                    video.srcObject = stream;
                    currentCamera = cameraType;
                    switchBtn.style.display = 'block';
                    
                    // Determine which camera we actually got
                    const actualCamera = await detectActiveCamera();
                    cameraStatus.textContent = actualCamera === 'rear' 
                        ? 'Rear camera active' 
                        : 'Front camera active';
                    
                    setTimeout(() => {
                        cameraStatus.style.display = 'none';
                    }, 3000);

                    video.onloadedmetadata = function() {
                        canvas.width = video.videoWidth;
                        canvas.height = video.videoHeight;
                        requestAnimationFrame(processFrame);
                    };
                } else {
                    throw new Error('Could not access camera');
                }
            } catch (err) {
                showError(`Could not start camera: ${err.message}`);
                console.error('Camera error:', err);
            }
        }

        // Try to get specific camera type
        async function tryGetCamera(cameraType) {
            // First try with device enumeration if possible
            const devices = await navigator.mediaDevices.enumerateDevices();
            const videoDevices = devices.filter(device => device.kind === 'videoinput');
            
            if (videoDevices.length > 1) {
                // Try to find camera by label
                const targetLabels = cameraType === 'front' 
                    ? ['front', 'face'] 
                    : ['back', 'rear', 'environment'];
                
                for (const device of videoDevices) {
                    const label = device.label.toLowerCase();
                    if (targetLabels.some(target => label.includes(target))) {
                        const stream = await tryGetUserMedia({
                            video: {
                                deviceId: { exact: device.deviceId },
                                width: { ideal: 1280 },
                                height: { ideal: 720 }
                            }
                        });
                        if (stream) return stream;
                    }
                }
            }
            
            // Fall back to facingMode constraints
            return await tryGetUserMedia({
                video: {
                    facingMode: cameraType === 'rear' ? 'environment' : 'user',
                    width: { ideal: 1280 },
                    height: { ideal: 720 }
                }
            });
        }

        // Detect which camera is actually being used
        async function detectActiveCamera() {
            if (!currentStream) return 'front';
            const tracks = currentStream.getVideoTracks();
            if (tracks.length === 0) return 'front';
            
            try {
                const settings = tracks[0].getSettings();
                if (settings.facingMode) {
                    return settings.facingMode === 'environment' ? 'rear' : 'front';
                }
                
                // For devices that don't report facingMode
                return currentCamera; // Return our intended camera
            } catch {
                return 'front';
            }
        }

        // Helper function to try getUserMedia with error handling
        async function tryGetUserMedia(constraints) {
            try {
                return await navigator.mediaDevices.getUserMedia(constraints);
            } catch (err) {
                console.warn('Failed with constraints:', constraints, err);
                return null;
            }
        }

        // Switch between cameras
        async function switchCamera() {
            const newCamera = currentCamera === 'rear' ? 'front' : 'rear';
            await startCamera(newCamera);
        }

        // Show error message
        function showError(message) {
            errorText.textContent = message;
            errorMessage.style.display = 'flex';
            cameraStatus.style.display = 'none';
            switchBtn.style.display = 'none';
        }

        // Initialize camera when page loads
        document.addEventListener('DOMContentLoaded', async () => {
            if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
                showError('Camera access is not supported by your browser');
                return;
            }

            // Request camera permissions first
            try {
                await startCamera('front');
            } catch (err) {
                showError('Please allow camera access to use this feature');
            }
        });

        // Handle orientation changes
        window.addEventListener('orientationchange', () => {
            setTimeout(() => {
                if (currentStream) {
                    canvas.width = video.videoWidth;
                    canvas.height = video.videoHeight;
                }
            }, 300);
        });

        async function processFrame() {
            alert("HERE0");
            if (video.videoWidth == 0 || video.videoHeight == 0) {
                requestAnimationFrame(processFrame);
                return;
            }
            alert("HERE1");

            if (!lastCalledTime) {
                lastCalledTime = performance.now();
                fps = 0;
            } else {
                const now = performance.now();
                delta = (now - lastCalledTime)/1000.0;
                lastCalledTime = now;
                accumFps += 1/delta;

                if (frameCounter++ >= 10) {
                    fps = accumFps/frameCounter;
                    frameCounter = 0;
                    accumFps = 0;
                    fpsMeter.innerText = `FPS: ${fps.toFixed(1)}`
                }
            }

            const videoAspectRatio = video.videoWidth / video.videoHeight;
            let targetWidth, targetHeight;

            if (videoAspectRatio > 1) {
                targetWidth = modelInputSize;
                targetHeight = modelInputSize / videoAspectRatio;
            } else {
                targetHeight = modelInputSize;
                targetWidth = modelInputSize * videoAspectRatio;
            }

            const offsetX = (modelInputSize - targetWidth) / 2;
            const offsetY = (modelInputSize - targetHeight) / 2;
            offscreenContext.clearRect(0, 0, modelInputSize, modelInputSize);
            offscreenContext.drawImage(video, offsetX, offsetY, targetWidth, targetHeight);
            const boxes = await detectObjectsOnFrame(offscreenContext);
            const validBoxes = [];
            for (let i = 0; i < boxes.length; i += 6)
                if (boxes[i + 4] > 0) validBoxes.push([boxes[i], boxes[i + 1], boxes[i + 2], boxes[i + 3], boxes[i + 5]]);
            drawBoxes(offscreenCanvas, validBoxes, targetWidth, targetHeight, offsetX, offsetY);
            requestAnimationFrame(processFrame);
        }

        function drawBoxes(offscreenCanvas, boxes, targetWidth, targetHeight, offsetX, offsetY) {
            const ctx = document.querySelector("canvas").getContext("2d");
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.lineWidth = 3;
            ctx.font = "30px serif";
            const scaleX = canvas.width / targetWidth;
            const scaleY = canvas.height / targetHeight;

            boxes.forEach(([x1, y1, x2, y2, classIndex]) => {
                const label = yolo_classes[classIndex];
                const color = classColors[classIndex];
                ctx.strokeStyle = color;
                ctx.fillStyle = color;
                const adjustedX1 = (x1 - offsetX) * scaleX;
                const adjustedY1 = (y1 - offsetY) * scaleY;
                const adjustedX2 = (x2 - offsetX) * scaleX;
                const adjustedY2 = (y2 - offsetY) * scaleY;
                const boxWidth = adjustedX2 - adjustedX1;
                const boxHeight = adjustedY2 - adjustedY1;
                ctx.strokeRect(adjustedX1, adjustedY1, boxWidth, boxHeight);
                const textWidth = ctx.measureText(label).width;
                ctx.fillRect(adjustedX1, adjustedY1 - 25, textWidth + 10, 25);
                ctx.fillStyle = "#FFFFFF";
                ctx.fillText(label, adjustedX1 + 5, adjustedY1 - 7);
            });
        }

        async function detectObjectsOnFrame(offscreenContext) {
            if (!net) {
                let device = await getDevice();
                if (!device) {
                    wgpuError.style.display = "block";
                    loadingContainer.style.display = "none";
                }
                net = await yolov8.load(device, "./net.safetensors");
                loadingContainer.style.display = "none";
            }
            const input = await prepareInput(offscreenContext);
            const output = await net(new Float32Array(input));
            return output[0];
        }

        async function prepareInput(offscreenContext) {
            return new Promise(resolve => {
                const imgData = offscreenContext.getImageData(0,0,modelInputSize,modelInputSize);
                const pixels = imgData.data;
                const red = [], green = [], blue = [];

                for (let index=0; index<pixels.length; index+=4) {
                    red.push(pixels[index]/255.0);
                    green.push(pixels[index+1]/255.0);
                    blue.push(pixels[index+2]/255.0);
                }
                const input = [...red, ...green, ...blue];
                resolve(input)
            })
        }

        const getDevice = async () => {
            if (!navigator.gpu) return false;
            const adapter = await navigator.gpu.requestAdapter();
            return await adapter.requestDevice({
                requiredFeatures: ["shader-f16"],
                powerPreference: "high-performance"
            });
        };
        
        const yolo_classes = [
            'person', 'bicycle', 'car', 'motorcycle', 'airplane', 'bus', 'train', 'truck', 'boat',
            'traffic light', 'fire hydrant', 'stop sign', 'parking meter', 'bench', 'bird', 'cat', 'dog', 'horse',
            'sheep', 'cow', 'elephant', 'bear', 'zebra', 'giraffe', 'backpack', 'umbrella', 'handbag', 'tie', 'suitcase',
            'frisbee', 'skis', 'snowboard', 'sports ball', 'kite', 'baseball bat', 'baseball glove', 'skateboard',
            'surfboard', 'tennis racket', 'bottle', 'wine glass', 'cup', 'fork', 'knife', 'spoon', 'bowl', 'banana', 'apple',
            'sandwich', 'orange', 'broccoli', 'carrot', 'hot dog', 'pizza', 'donut', 'cake', 'chair', 'couch', 'potted plant',
            'bed', 'dining table', 'toilet', 'tv', 'laptop', 'mouse', 'remote', 'keyboard', 'cell phone', 'microwave', 'oven',
            'toaster', 'sink', 'refrigerator', 'book', 'clock', 'vase', 'scissors', 'teddy bear', 'hair drier', 'toothbrush'
        ];

        function generateColors(numColors) {
            const colors = [];
            for (let i = 0; i < 360; i += 360 / numColors) {
                colors.push(`hsl(${i}, 100%, 50%)`);
            }
            return colors;
        }

        const classColors = generateColors(yolo_classes.length);
    </script>
</body>
</html>
