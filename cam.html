<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Rear Camera Viewer</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #000;
            overflow: hidden;
            touch-action: none;
        }
        #video {
            width: 100%;
            height: 100vh;
            object-fit: cover;
        }
        #status {
            position: fixed;
            top: 20px;
            left: 0;
            right: 0;
            text-align: center;
            color: white;
            font-family: Arial, sans-serif;
            background-color: rgba(0,0,0,0.5);
            padding: 10px;
            z-index: 100;
        }
        #error {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: white;
            font-family: Arial, sans-serif;
            background-color: rgba(0,0,0,0.8);
            padding: 20px;
            text-align: center;
            display: none;
            z-index: 200;
        }
        #switch-btn {
            position: fixed;
            bottom: 20px;
            right: 20px;
            width: 50px;
            height: 50px;
            background-color: rgba(255,255,255,0.3);
            color: white;
            border: none;
            border-radius: 50%;
            font-size: 20px;
            z-index: 100;
            display: none;
        }
        #retry-btn {
            margin-top: 20px;
            padding: 10px 20px;
            background-color: #4285f4;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 16px;
        }
    </style>
</head>
<body>
    <video id="video" autoplay playsinline></video>
    <div id="status">Initializing camera...</div>
    <div id="error">
        <div id="error-message"></div>
        <button id="retry-btn">Try Again</button>
    </div>
    <button id="switch-btn" title="Switch camera">↻</button>

    <script>
        const video = document.getElementById('video');
        const status = document.getElementById('status');
        const errorDiv = document.getElementById('error');
        const errorMessage = document.getElementById('error-message');
        const switchBtn = document.getElementById('switch-btn');
        const retryBtn = document.getElementById('retry-btn');

        let currentStream = null;
        let currentCamera = 'environment'; // Start with rear camera

        // Function to stop the current stream
        function stopCurrentStream() {
            if (currentStream) {
                currentStream.getTracks().forEach(track => track.stop());
                currentStream = null;
            }
        }

        // Function to start camera with specified facing mode
        async function startCamera(facingMode) {
            status.textContent = facingMode === 'environment' 
                ? 'Starting rear camera...' 
                : 'Starting front camera...';
            status.style.display = 'block';
            errorDiv.style.display = 'none';
            
            try {
                // Stop any existing stream
                stopCurrentStream();

                // Try with ideal constraints first
                let stream = await tryGetUserMedia({
                    video: {
                        facingMode: { ideal: facingMode },
                        width: { ideal: 1280 },
                        height: { ideal: 720 }
                    }
                });

                // If that fails, try with exact constraints
                if (!stream) {
                    stream = await tryGetUserMedia({
                        video: {
                            facingMode: { exact: facingMode },
                            width: { ideal: 1280 },
                            height: { ideal: 720 }
                        }
                    });
                }

                // If still no luck, try with device enumeration
                if (!stream) {
                    const devices = await navigator.mediaDevices.enumerateDevices();
                    const videoDevices = devices.filter(d => d.kind === 'videoinput');
                    
                    if (videoDevices.length > 0) {
                        // Try each video device until we find one that works
                        for (const device of videoDevices) {
                            stream = await tryGetUserMedia({
                                video: {
                                    deviceId: { exact: device.deviceId },
                                    width: { ideal: 1280 },
                                    height: { ideal: 720 }
                                }
                            });
                            if (stream) break;
                        }
                    }
                }

                if (stream) {
                    currentStream = stream;
                    video.srcObject = stream;
                    currentCamera = facingMode;
                    switchBtn.style.display = 'block';
                    status.textContent = facingMode === 'environment' 
                        ? 'Rear camera active' 
                        : 'Front camera active';
                    
                    // Hide status after 3 seconds
                    setTimeout(() => {
                        status.style.display = 'none';
                    }, 3000);
                } else {
                    throw new Error('Could not access any camera');
                }
            } catch (err) {
                showError(`Could not start camera: ${err.message}`);
                console.error('Camera error:', err);
            }
        }

        // Helper function to try getUserMedia with error handling
        async function tryGetUserMedia(constraints) {
            try {
                return await navigator.mediaDevices.getUserMedia(constraints);
            } catch (err) {
                console.warn(`Failed with constraints:`, constraints, err);
                return null;
            }
        }

        // Show error message
        function showError(message) {
            errorMessage.textContent = message;
            errorDiv.style.display = 'flex';
            status.style.display = 'none';
            switchBtn.style.display = 'none';
        }

        // Switch between cameras
        async function switchCamera() {
            const newMode = currentCamera === 'environment' ? 'user' : 'environment';
            await startCamera(newMode);
        }

        // Event listeners
        switchBtn.addEventListener('click', switchCamera);
        retryBtn.addEventListener('click', () => startCamera(currentCamera));

        // Check for camera support when page loads
        document.addEventListener('DOMContentLoaded', async () => {
            if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
                showError('Camera access is not supported by your browser');
                return;
            }

            // Request camera permissions first
            try {
                await navigator.mediaDevices.getUserMedia({ video: true });
                // Now start with rear camera
                await startCamera('environment');
            } catch (err) {
                showError('Please allow camera access to use this feature');
            }
        });

        // Handle orientation changes
        window.addEventListener('orientationchange', () => {
            setTimeout(() => {
                if (currentStream) {
                    startCamera(currentCamera);
                }
            }, 300);
        });
    </script>
</body>
</html>
